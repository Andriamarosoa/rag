[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ws-orchestrator"
version = "0.1.0"
description = "WebSocket orchestration layer with Codex MCP, persistent chat context, JSON functional rules, and code-defined agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mcp>=1.0.0",
  "httpx>=0.27",
  "aiomysql>=0.2.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["config*", "tests*", "docs*", "data*", "mariadb_data*", "codex_data*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "codex_data", "data", "mariadb_data"]
