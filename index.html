<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG WebSocket Tester</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0b1020; color: #e8ecf4; }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 28px auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { margin: 0 0 24px; color: #9ca8bd; }
    .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
    .card { background: #121a2d; border: 1px solid #26324c; border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .field { flex: 1 1 180px; }
    label { display: block; margin-bottom: 6px; font-size: 12px; color: #aab5c8; }
    input, textarea { width: 100%; border: 1px solid #33415f; background: #0d1425; color: #f5f7fb; border-radius: 9px; padding: 10px 12px; outline: none; }
    input:focus, textarea:focus { border-color: #6f8cff; }
    textarea { min-height: 94px; resize: vertical; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; cursor: pointer; font-weight: 700; background: #6f8cff; color: white; }
    button.secondary { background: #26324c; }
    button.danger { background: #9d3c4c; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 10px; border-radius: 999px; background: #202a41; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #e05c6f; }
    .status.connected .dot { background: #51d88a; }
    .messages { height: 430px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    .msg { padding: 11px 13px; border-radius: 10px; background: #0d1425; border: 1px solid #26324c; white-space: pre-wrap; word-break: break-word; }
    .msg.user { border-color: #425fc7; }
    .msg.assistant { border-color: #2e8b64; }
    .msg.system { color: #aeb9cb; font-size: 13px; }
    .event { margin-bottom: 8px; border: 1px solid #26324c; border-radius: 8px; background: #090f1d; }
    .event summary { cursor: pointer; padding: 9px 11px; color: #b9c5d8; }
    .event pre { margin: 0; padding: 0 11px 11px; overflow: auto; color: #d6def0; font-size: 12px; }
    .tools { display: grid; gap: 12px; }
    .tool { border-top: 1px solid #26324c; padding-top: 14px; }
    .tool:first-child { border-top: 0; padding-top: 0; }
    .small { color: #8f9bb0; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    code { color: #a9bdff; }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } .messages { height: 320px; } }
  </style>
</head>
<body>
<div class="wrap">
  <h1>RAG WebSocket Tester</h1>
  <p class="sub">Test du WebSocket, des sessions, des rules et des agents du backend.</p>

  <div class="card" style="margin-bottom:18px">
    <div class="row">
      <div class="field" style="flex:2 1 340px">
        <label for="wsUrl">WebSocket URL</label>
        <input id="wsUrl" />
      </div>
      <div class="field">
        <label for="userId">User ID</label>
        <input id="userId" value="demo-user" />
      </div>
      <div class="field">
        <label for="chatId">Chat ID (optionnel)</label>
        <input id="chatId" placeholder="créé automatiquement" />
      </div>
      <button id="connectBtn">Connecter</button>
      <button id="disconnectBtn" class="danger" disabled>Déconnecter</button>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <span id="status" class="status"><span class="dot"></span><span>Déconnecté</span></span>
      <span class="small">Connection ID: <code id="connectionId">-</code></span>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <h2 style="margin-top:0">Chat</h2>
      <div id="messages" class="messages"></div>
      <div style="margin-top:14px">
        <textarea id="message" placeholder="Ex: J'ai oublié mon mot de passe, comment le réinitialiser ?"></textarea>
        <div class="actions">
          <button id="sendBtn" disabled>Envoyer</button>
          <button id="pingBtn" class="secondary" disabled>Ping</button>
          <button id="reloadRulesBtn" class="secondary" disabled>Reload rules</button>
          <button id="clearBtn" class="secondary">Effacer l'écran</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 style="margin-top:0">Actions / Agents</h2>
      <div class="tools">
        <div class="tool">
          <strong>send_email</strong>
          <p class="small">Teste l'agent email. L'envoi nécessite explicitement <code>confirmed=true</code>.</p>
          <label>To</label>
          <input id="emailTo" value="test@example.com" />
          <label style="margin-top:8px">Subject</label>
          <input id="emailSubject" value="Test RAG" />
          <label style="margin-top:8px">Body</label>
          <textarea id="emailBody">Bonjour, ceci est un test depuis l'interface WebSocket RAG.</textarea>
          <div class="actions">
            <button id="emailPreviewBtn" class="secondary" disabled>Exécuter sans confirmation</button>
            <button id="emailConfirmBtn" disabled>Confirmer & exécuter</button>
          </div>
        </div>
      </div>

      <h2>Événements WebSocket</h2>
      <div id="events"></div>
    </section>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const wsUrl = $('wsUrl');
  const statusEl = $('status');
  const connectionId = $('connectionId');
  const messages = $('messages');
  const events = $('events');
  let socket = null;

  const defaultWs = location.protocol === 'https:'
    ? `wss://${location.host}/ws`
    : location.protocol === 'http:'
      ? `ws://${location.host}/ws`
      : 'ws://localhost:8000/ws';
  wsUrl.value = defaultWs;

  function requestId() {
    return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
  }

  function connected() {
    return socket && socket.readyState === WebSocket.OPEN;
  }

  function setConnected(value) {
    statusEl.classList.toggle('connected', value);
    statusEl.querySelector('span:last-child').textContent = value ? 'Connecté' : 'Déconnecté';
    $('connectBtn').disabled = value;
    $('disconnectBtn').disabled = !value;
    ['sendBtn','pingBtn','reloadRulesBtn','emailPreviewBtn','emailConfirmBtn'].forEach(id => $(id).disabled = !value);
  }

  function addMessage(kind, text) {
    const div = document.createElement('div');
    div.className = `msg ${kind}`;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function addEvent(direction, payload) {
    const details = document.createElement('details');
    details.className = 'event';
    const summary = document.createElement('summary');
    summary.textContent = `${direction} ${payload.type || 'event'}${payload.request_id ? ` · ${payload.request_id}` : ''}`;
    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(payload, null, 2);
    details.append(summary, pre);
    events.prepend(details);
  }

  function envelope(type, data = {}) {
    return {
      type,
      request_id: requestId(),
      user_id: $('userId').value.trim() || 'demo-user',
      chat_id: $('chatId').value.trim() || null,
      data
    };
  }

  function send(payload) {
    if (!connected()) return;
    socket.send(JSON.stringify(payload));
    addEvent('→', payload);
  }

  function connect() {
    if (socket) socket.close();
    addMessage('system', `Connexion à ${wsUrl.value}...`);
    socket = new WebSocket(wsUrl.value.trim());

    socket.onopen = () => {
      setConnected(true);
      addMessage('system', 'WebSocket connecté.');
    };

    socket.onclose = (event) => {
      setConnected(false);
      connectionId.textContent = '-';
      addMessage('system', `WebSocket fermé (code ${event.code}).`);
    };

    socket.onerror = () => addMessage('system', 'Erreur WebSocket. Vérifie que le backend est lancé et que l’URL est correcte.');

    socket.onmessage = (event) => {
      let payload;
      try { payload = JSON.parse(event.data); }
      catch { payload = { type: 'raw', data: event.data }; }
      addEvent('←', payload);

      if (payload.type === 'connection.ready') {
        connectionId.textContent = payload.data?.connection_id || '-';
      }
      if (payload.chat_id) $('chatId').value = payload.chat_id;

      if (payload.type === 'assistant.started') {
        addMessage('system', 'Assistant en cours...');
      } else if (payload.type === 'assistant.completed') {
        const answer = payload.data?.answer ?? payload.data?.response ?? payload.data?.text ?? JSON.stringify(payload.data, null, 2);
        addMessage('assistant', String(answer));
        const suggestions = payload.data?.suggestions || payload.data?.actions;
        if (suggestions?.length) addMessage('system', `Suggestions/actions:\n${JSON.stringify(suggestions, null, 2)}`);
      } else if (payload.type === 'agent.result') {
        addMessage('system', `Agent ${payload.data?.agent}: ${payload.data?.ok ? 'OK' : 'ERREUR'}\n${JSON.stringify(payload.data, null, 2)}`);
      } else if (payload.type === 'rules.reloaded') {
        addMessage('system', `Rules rechargées: ${payload.data?.count ?? '?'} règle(s), version ${payload.data?.version ?? '?'}.`);
      } else if (payload.type === 'pong') {
        addMessage('system', 'Pong reçu.');
      } else if (payload.type === 'error') {
        addMessage('system', `Erreur: ${JSON.stringify(payload.data)}`);
      }
    };
  }

  $('connectBtn').onclick = connect;
  $('disconnectBtn').onclick = () => socket?.close(1000, 'manual disconnect');
  $('sendBtn').onclick = () => {
    const text = $('message').value.trim();
    if (!text) return;
    addMessage('user', text);
    send(envelope('chat.message', { text }));
    $('message').value = '';
  };
  $('message').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      $('sendBtn').click();
    }
  });
  $('pingBtn').onclick = () => send(envelope('ping'));
  $('reloadRulesBtn').onclick = () => send(envelope('rules.reload'));
  $('clearBtn').onclick = () => { messages.innerHTML = ''; events.innerHTML = ''; };

  function emailPayload(confirmed) {
    return envelope('agent.execute', {
      agent: 'send_email',
      confirmed,
      arguments: {
        to: $('emailTo').value.trim(),
        subject: $('emailSubject').value.trim(),
        body: $('emailBody').value
      }
    });
  }
  $('emailPreviewBtn').onclick = () => send(emailPayload(false));
  $('emailConfirmBtn').onclick = () => send(emailPayload(true));

  setConnected(false);
</script>
</body>
</html>
